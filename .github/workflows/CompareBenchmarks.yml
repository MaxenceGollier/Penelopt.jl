name: Compare Benchmarks

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: >
          Run ID of a completed "Run Benchmark" run to compare.
          Leave empty to use the latest successful run on this branch.
        required: false
        type: string
  workflow_call:
  workflow_run:
    workflows: ["Run Benchmark"]
    types:
      - completed

jobs:
  Compare:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Download benchmark artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Using triggering run id: $RUN_ID"
          elif [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
            echo "Using manually supplied run id: $RUN_ID"
          else
            echo "Looking for latest successful Run Benchmark run on branch: $BRANCH"
            RUN_ID=$(gh run list \
              --workflow "Run Benchmark" \
              --branch "$BRANCH" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::No Run Benchmark run id could be determined"
            exit 1
          fi

          gh run download "$RUN_ID" \
            --dir artifacts/current

      - name: Download latest saved benchmark (reference)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REF_RUN_ID=$(gh run list \
            --workflow SaveBenchmark.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$REF_RUN_ID" ]; then
            echo "::error::No successful SaveBenchmark.yml run found"
            exit 1
          fi

          echo "Found SaveBenchmark run id: $REF_RUN_ID"

          gh run download "$REF_RUN_ID" \
            --dir artifacts/reference

      - name: Download latest ipopt benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REF_RUN_ID=$(gh run list \
            --workflow RunIpoptBenchmark.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$REF_RUN_ID" ]; then
            echo "::error::No successful RunIpoptBenchmark.yml run found"
            exit 1
          fi

          echo "Found RunIpoptBenchmark run id: $REF_RUN_ID"

          gh run download "$REF_RUN_ID" \
            --dir artifacts/ipopt

      - name: Show artifacts
        run: |
          ls artifacts -R
      - name: Compare benchmarks
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            include("benchmark/compare-benchmarks.jl")
          '
      - name: Upload benchmark plots
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-plots
          path: benchmark/result/*.svg
