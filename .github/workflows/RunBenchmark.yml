name: Run Benchmark

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_call:

jobs:
  Benchmark-LBFGS:
    strategy:
      fail-fast: false
      matrix:
        split: [1, 2, 3, 4]

    runs-on: windows-latest

    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run CUTEst benchmark')

    env:
      MUMPS_SEQ: true
      CUTEST_SPLIT: ${{ matrix.split }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            mkpath("benchmark/result")
          '

      - name: Run LBFGS benchmark
        run: |
          julia --project=benchmark -e '
            include("benchmark/benchmark-cutest-lbfgs.jl")
          '

      - name: Upload LBFGS benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cutest-benchmark-stats-lbfgs-${{ matrix.split }}
          path: benchmark/result
          if-no-files-found: error


  Benchmark-Exact-Hessian:
    strategy:
      fail-fast: false
      matrix:
        split: [1, 2]

    runs-on: windows-latest

    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run CUTEst benchmark')

    env:
      MUMPS_SEQ: true
      CUTEST_SPLIT: ${{ matrix.split }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            mkpath("benchmark/result")
          '

      - name: Run benchmarks with exact Hessian
        run: |
          julia --project=benchmark -e '
            include("benchmark/benchmark-cutest-exact-hessian.jl")
          '

      - name: Upload exact-Hessian benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cutest-benchmark-stats-exact-hessian-${{ matrix.split }}
          path: benchmark/result
          if-no-files-found: error

  Certify-Reference:
    needs: [Benchmark-LBFGS, Benchmark-Exact-Hessian]

    runs-on: windows-latest

    # Precompute reference's own infeasibility certification here, once,
    # whenever this run is producing a new reference baseline (i.e. NOT a
    # pull_request event - SaveBenchmark.yml calling this via
    # workflow_call, on main pushes/schedule). PR runs never certify
    # reference themselves; they load whatever this job last produced (see
    # the Compare job and compare-benchmarks.jl's
    # load_precomputed_certification). Same "if: replaces implicit needs
    # gating" caveat as Compare below.
    if: >
      needs.Benchmark-LBFGS.result == 'success' &&
      needs.Benchmark-Exact-Hessian.result == 'success' &&
      github.event_name != 'pull_request'

    env:
      MUMPS_SEQ: true

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: cutest-benchmark-stats-*
          path: benchmark/result
          merge-multiple: true

      - name: Certify infeasibility
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            include("benchmark/certify-infeasibility.jl")
          '

      - name: Upload infeasibility certification
        uses: actions/upload-artifact@v4
        with:
          name: infeasibility-certification-reference
          path: benchmark/result/infeasibility_certification.jld2
          if-no-files-found: error

  Compare:
    needs: [Benchmark-LBFGS, Benchmark-Exact-Hessian]

    runs-on: windows-latest

    # Only run for an actual labeled pull_request event - NOT when this
    # workflow is invoked via workflow_call (e.g. from SaveBenchmark.yml on
    # main pushes/schedule, where there's no PR to compare against and no
    # need to pay for re-solving the flagged infeasible problems). Since an
    # explicit `if:` replaces the implicit "needs succeeded" check rather
    # than adding to it, that's re-checked here too.
    if: >
      needs.Benchmark-LBFGS.result == 'success' &&
      needs.Benchmark-Exact-Hessian.result == 'success' &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run CUTEst benchmark')

    # Certifying flagged :infeasible problems re-solves each of them from
    # scratch and is by far the most expensive part of this job (a recent
    # run took ~1h30 because of it). Off by default; opt in with the
    # "certify infeasibility" label on top of "run CUTEst benchmark" when
    # you actually need the certified perf-profile reclassification, rather
    # than just the (fast) list of flagged problems.
    env:
      CERTIFY_INFEASIBILITY: ${{ contains(github.event.pull_request.labels.*.name, 'certify infeasibility') }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Download current benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: cutest-benchmark-stats-*
          path: artifacts/current
          merge-multiple: true

      - name: Download latest saved benchmark (reference)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REF_RUN_ID=$(gh run list \
            --workflow SaveBenchmark.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$REF_RUN_ID" ]; then
            echo "::error::No successful SaveBenchmark.yml run found"
            exit 1
          fi

          echo "Found SaveBenchmark run id: $REF_RUN_ID"

          gh run download "$REF_RUN_ID" \
            --dir artifacts/reference

      - name: Download latest ipopt benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REF_RUN_ID=$(gh run list \
            --workflow RunIpoptBenchmark.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$REF_RUN_ID" ]; then
            echo "::error::No successful RunIpoptBenchmark.yml run found"
            exit 1
          fi

          echo "Found RunIpoptBenchmark run id: $REF_RUN_ID"

          gh run download "$REF_RUN_ID" \
            --dir artifacts/ipopt

      - name: Show artifacts
        run: |
          ls artifacts -R

      - name: Compare benchmarks
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            include("benchmark/compare-benchmarks.jl")
          '

      - name: Upload benchmark plots
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-plots
          path: benchmark/result/*.svg