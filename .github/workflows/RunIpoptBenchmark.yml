name: Run IPOPT Benchmark

on:
  schedule:
    - cron: "0 0 1 */2 *"
  workflow_dispatch:

jobs:
  Benchmark-IPOPT-LBFGS:
    strategy:
      fail-fast: false
      matrix:
        split: [1, 2, 3, 4]

    runs-on: windows-latest

    env:
      CUTEST_SPLIT: ${{ matrix.split }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            mkpath("benchmark/result")
          '

      - name: Run Ipopt LBFGS benchmark
        run: |
          julia --project=benchmark -e '
            include("benchmark/benchmark-cutest-ipopt-lbfgs.jl")
          '

      - name: Upload Ipopt LBFGS benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cutest-ipopt-benchmark-stats-lbfgs-${{ matrix.split }}
          path: benchmark/result
          if-no-files-found: error
  
  Benchmark-Exact-Hessian:
    strategy:
      fail-fast: false
      matrix:
        split: [1, 2]

    runs-on: windows-latest

    env:
      CUTEST_SPLIT: ${{ matrix.split }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            mkpath("benchmark/result")
          '

      - name: Run benchmarks with exact Hessian
        run: |
          julia --project=benchmark -e '
            include("benchmark/benchmark-cutest-ipopt-exact-hessian.jl")
          '

      - name: Upload exact-Hessian benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cutest-ipopt-benchmark-stats-exact-hessian-${{ matrix.split }}
          path: benchmark/result
          if-no-files-found: error

  Certify-Ipopt:
    needs: [Benchmark-IPOPT-LBFGS, Benchmark-Exact-Hessian]

    runs-on: windows-latest

    # PRs load whatever this last produced instead of re-solving IPOPT's
    # flagged problems every run.
    if: >
      needs.Benchmark-IPOPT-LBFGS.result == 'success' &&
      needs.Benchmark-Exact-Hessian.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: cutest-ipopt-benchmark-stats-*
          path: benchmark/result
          merge-multiple: true

      - name: Certify infeasibility
        run: |
          julia --project=benchmark -e '
            using Pkg
            Pkg.instantiate()
            include("benchmark/certify-infeasibility.jl")
          '

      - name: Upload infeasibility certification
        uses: actions/upload-artifact@v4
        with:
          name: infeasibility-certification-ipopt
          path: benchmark/result/infeasibility_certification.jld2
          if-no-files-found: error